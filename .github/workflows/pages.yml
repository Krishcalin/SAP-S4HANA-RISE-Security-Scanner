# Publish the architecture guide, and ONLY the architecture guide.
#
# Pages was previously served straight from `docs/`, which publishes the whole
# folder — and docs/ holds COMPETITIVE_ANALYSIS.md, COMPETITOR_SECURITYBRIDGE.md,
# PIVOT_PLAN.md and BUILD_ROADMAP.md. The repository is public so none of that
# was newly readable, but a github.io site is crawled where a repository blob
# largely is not, and "already public" is a poor reason to publish something
# twice. This job stages one file instead.
#
# There is still exactly one copy of the guide. `docs/ARCHITECTURE.html` is the
# source, it is what a clone gets, and this workflow copies it — it does not
# maintain a second edition on a branch that could drift from the first.

name: pages

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/ARCHITECTURE.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never two deployments at once, and never cancel one half-done: the site would
# be left serving whichever build lost the race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: publish the architecture guide
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # THE GUIDE IS VERIFIED BEFORE IT IS PUBLISHED, not after. The diagrams
      # are hand-authored SVG and their defects — a connector through a box, two
      # lines superimposed, an arrowhead in empty space — are invisible in the
      # markup and obvious on screen. The previous revision shipped seven.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: verify the diagrams
        run: python -m tools.svg_geometry_check docs/ARCHITECTURE.html

      - name: stage the site
        run: |
          mkdir -p _site
          cp docs/ARCHITECTURE.html _site/ARCHITECTURE.html
          # Serve the file as authored rather than as Jekyll input.
          touch _site/.nojekyll
          # The guide is the whole site, so the root is the guide. A redirect
          # rather than a copy: two files would be two things to keep in step.
          cat > _site/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <title>MonitorRisk — System Architecture</title>
          <meta http-equiv="refresh" content="0; url=./ARCHITECTURE.html">
          <link rel="canonical" href="./ARCHITECTURE.html">
          </head>
          <body><p><a href="./ARCHITECTURE.html">MonitorRisk — System Architecture</a></p></body>
          </html>
          HTML
          # Only the guide is here now, so there is nothing left to keep out.
          printf 'User-agent: *\nAllow: /\n' > _site/robots.txt
          echo "staged:" && find _site -type f | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
