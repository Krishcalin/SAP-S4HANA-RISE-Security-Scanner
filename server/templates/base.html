<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SAP Security Platform{% endblock %}</title>
<style>
:root{
  --bg:#0f1419; --panel:#161c24; --panel-2:#1c242e; --line:#26313d;
  --ink:#e6edf3; --ink-dim:#8b98a5; --ink-faint:#5c6873;
  --accent:#3b82f6; --accent-dim:#1e3a5f;
  --crit:#f43f5e; --high:#fb923c; --med:#eab308; --low:#38bdf8; --ok:#22c55e;
  --radius:8px;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f6f8fa; --panel:#fff; --panel-2:#f0f3f6; --line:#d7dee6;
    --ink:#1c2128; --ink-dim:#57606a; --ink-faint:#8c959f; --accent-dim:#dbeafe;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code,.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.92em}

header.top{display:flex;align-items:center;gap:22px;padding:0 22px;height:54px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand span{color:var(--accent)}
nav.main{display:flex;gap:4px;flex:1}
nav.main a{padding:6px 12px;border-radius:6px;color:var(--ink-dim);font-weight:500}
nav.main a:hover{background:var(--panel-2);text-decoration:none;color:var(--ink)}
nav.main a.on{background:var(--accent-dim);color:var(--accent)}
.who{color:var(--ink-dim);font-size:13px;display:flex;align-items:center;gap:10px}
.who .role{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  padding:2px 7px;border-radius:99px;background:var(--panel-2);border:1px solid var(--line)}

main{max-width:1440px;margin:0 auto;padding:24px 22px 64px}
h1{font-size:21px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:15px;margin:26px 0 10px;color:var(--ink)}
.sub{color:var(--ink-dim);margin:0 0 20px}

.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  color:var(--ink-faint);font-weight:600}
.kpi{font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.kpi.crit{color:var(--crit)} .kpi.warn{color:var(--high)} .kpi.ok{color:var(--ok)}
.kpi-note{color:var(--ink-dim);font-size:12px;margin-top:5px}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink-faint);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:hover{background:var(--panel-2)}
.wrap{overflow-x:auto}

.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;
  font-weight:600;letter-spacing:.02em;white-space:nowrap}
.sev-CRITICAL{background:rgba(244,63,94,.15);color:var(--crit)}
.sev-HIGH{background:rgba(251,146,60,.15);color:var(--high)}
.sev-MEDIUM{background:rgba(234,179,8,.15);color:var(--med)}
.sev-LOW{background:rgba(56,189,248,.15);color:var(--low)}
.sev-INFO{background:var(--panel-2);color:var(--ink-dim)}
.st{background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line)}
.st-open{background:rgba(244,63,94,.12);color:var(--crit);border-color:transparent}
.st-submitted_to_provider{background:rgba(59,130,246,.14);color:var(--accent);border-color:transparent}
.st-resolved{background:rgba(34,197,94,.13);color:var(--ok);border-color:transparent}
.st-accepted{background:rgba(234,179,8,.13);color:var(--med);border-color:transparent}

/* Remediation ownership. In RISE a customer can SEE a bad parameter and cannot fix
   it, so the badge is the difference between an action and unactionable noise. */
.own{font-size:11px;padding:2px 8px;border-radius:4px;font-weight:600;white-space:nowrap}
.own-customer_fixable{background:rgba(34,197,94,.13);color:var(--ok)}
.own-ticket_to_sap{background:rgba(59,130,246,.14);color:var(--accent)}
.own-provider_owned{background:var(--panel-2);color:var(--ink-dim)}
.own-not_assessable{background:var(--panel-2);color:var(--ink-faint);
  border:1px dashed var(--line)}

.banner{padding:11px 14px;border-radius:var(--radius);margin-bottom:16px;font-size:13px;
  border:1px solid var(--line);background:var(--panel)}
.banner.warn{border-color:rgba(251,146,60,.4);background:rgba(251,146,60,.07)}
.banner.info{border-color:rgba(59,130,246,.35);background:rgba(59,130,246,.07)}
.banner.bad{border-color:rgba(244,63,94,.4);background:rgba(244,63,94,.07)}
.banner strong{font-weight:650}

form.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,input[type=text],input[type=password],input[type=date],textarea{
  background:var(--panel);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:7px 10px;font:inherit;font-size:13px}
select:focus,input:focus,textarea:focus{outline:2px solid var(--accent-dim);border-color:var(--accent)}
button,.btn{background:var(--accent);color:#fff;border:0;border-radius:6px;
  padding:7px 14px;font:inherit;font-size:13px;font-weight:550;cursor:pointer}
button:hover,.btn:hover{filter:brightness(1.08);text-decoration:none}
button.ghost,.btn.ghost{background:var(--panel-2);color:var(--ink);border:1px solid var(--line)}

/* Priority tier. Ranked above severity in the queue because the tier already
   folds in exploitability, exposure and privilege — an unreachable CRITICAL
   should not outrank an actively-exploited HIGH. */
.tier{display:inline-block;padding:2px 7px;border-radius:4px;font-size:11px;
  font-weight:700;letter-spacing:.03em}
.tier-P1{background:var(--crit);color:#fff}
.tier-P2{background:var(--high);color:#1c2128}
.tier-P3{background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line)}
.tier-P4{background:transparent;color:var(--ink-faint);border:1px dashed var(--line)}

.muted{color:var(--ink-dim)}
.faint{color:var(--ink-faint)}
.small{font-size:12px}
.right{text-align:right}
.bar{height:6px;border-radius:3px;background:var(--panel-2);overflow:hidden;margin-top:8px}
.bar > i{display:block;height:100%;background:var(--accent)}
.empty{padding:36px;text-align:center;color:var(--ink-dim)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0}
dl.kv dt{color:var(--ink-faint);font-size:12px}
dl.kv dd{margin:0}
</style>
{% block head %}{% endblock %}
</head>
<body>
{% if user %}
<header class="top">
  <div class="brand">SAP<span>Sec</span></div>
  <nav class="main">
    <a href="/" class="{{ 'on' if nav=='dash' }}">Dashboard</a>
    <a href="/findings" class="{{ 'on' if nav=='findings' }}">Findings</a>
    <a href="/trend" class="{{ 'on' if nav=='trend' }}">Trend</a>
    <a href="/paths" class="{{ 'on' if nav=='paths' }}">Paths</a>
    <a href="/risk" class="{{ 'on' if nav=='risk' }}">Risk ($)</a>
    {% if user.role in ('analyst','admin') %}
    <a href="/upload" class="{{ 'on' if nav=='upload' }}">Upload</a>
    {% endif %}
  </nav>
  <div class="who">
    <span>{{ user.display_name or user.username }}</span>
    <span class="role">{{ user.role }}</span>
    <form method="post" action="/logout" style="margin:0">
      <button class="ghost" type="submit">Sign out</button>
    </form>
  </div>
</header>
{% endif %}
<main>{% block body %}{% endblock %}</main>
</body>
</html>
